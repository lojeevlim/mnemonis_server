name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mnemonis
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mnemonis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemonis -d mnemonis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mnemonis:ci-only-password@localhost:5432/mnemonis_test
      DATABASE_URL: postgres://mnemonis:ci-only-password@localhost:5432/mnemonis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
