# Local topology: postgres + api (this project) [+ the MCP adapter from ../mnemonis_mcp with `--profile full`].
#   docker compose up -d postgres              # just the database (npm run dev / npm test use it from the host)
#   docker compose up -d --build api           # postgres + the API on 127.0.0.1:8787
#   docker compose --profile full up -d --build  # + the MCP adapter on 127.0.0.1:8788
# Needs POSTGRES_PASSWORD in .env (or the shell). The web app (../mnemonis) runs on the host: npm run dev -> http://localhost:5173.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnemonis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mnemonis}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates mnemonis_test on first init only (existing volumes: run `CREATE DATABASE mnemonis_test;` manually).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnemonis} -d ${POSTGRES_DB:-mnemonis}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mnemonis}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mnemonis}
      # The database is the compose-internal service, not a remote host: acknowledge the remote-database guard.
      MNEMONIS_ALLOW_REMOTE_DB: "true"
      MNEMONIS_AUTO_MIGRATE: "true"
      HOST: 0.0.0.0
      PORT: "8787"
      MNEMONIS_ALLOW_REGISTRATION: "true"
      MNEMONIS_ALLOWED_ORIGINS: http://localhost:5173
      # The adapter reaches the API as api:8787 inside the compose network.
      MNEMONIS_ALLOWED_HOSTS: api:8787
      # What the web app shows in the `claude mcp add` command (GET /api/auth/config).
      MNEMONIS_MCP_URL: http://localhost:8788/mcp
      # Optional shared secret with the adapter (same value on both sides): lets the API see each MCP client's real IP on
      # /api/agent/* (per-client failed-auth buckets). Set MNEMONIS_ADAPTER_SECRET in .env (16+ characters); empty = off.
      MNEMONIS_ADAPTER_SECRET: ${MNEMONIS_ADAPTER_SECRET:-}
    ports:
      - "127.0.0.1:8787:8787"

  mcp:
    profiles: ["full"]
    build: ../mnemonis_mcp
    depends_on:
      - api
    environment:
      MNEMONIS_API_URL: http://api:8787
      # http between containers on a private network is fine; https is required for anything else.
      MNEMONIS_API_ALLOW_INSECURE_PRIVATE: "true"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8788"
      MNEMONIS_ADAPTER_SECRET: ${MNEMONIS_ADAPTER_SECRET:-}
    ports:
      - "127.0.0.1:8788:8788"

volumes:
  pgdata:
